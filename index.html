<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>TaskFlow - Smart Weekly Planner & Productivity App</title>

    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#7C3AED">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TaskFlow">
    <link rel="apple-touch-icon" href="/src/img/icons/icon-192.png">
    <link rel="apple-touch-startup-image" href="/src/img/icons/splash-2048.png">

    <link rel="stylesheet" href="src/css/microframework.css">
    <link rel="stylesheet" href="src/css/dashboard.css">
    <link rel="stylesheet" href="src/css/tarefas.css">
    <link rel="stylesheet" href="src/css/navbar.css">
    <link rel="stylesheet" href="src/css/categorias.css">
    <link rel="stylesheet" href="src/css/modal.css">
    <link rel="stylesheet" href="src/css/login.css">
    <link rel="stylesheet" href="src/css/perfil.css">
    <link rel="stylesheet" href="src/css/responsive.css">
    <link rel="stylesheet" href="src/css/calendario.css">
    <link rel="stylesheet" href="src/css/navbar-mobile.css">
    <link rel="stylesheet" href="src/css/premium.css">
</head>

<body>
    <!-- Background Animado Inspirado no Portfólio da Keren -->
    <div class="hero-bg">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <header id="navbar"></header>
    <main id="app"></main>
    <nav class="mobile-tabs"></nav>

    <script src="src/js/main.js" type="module"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", async () => {
                try {
                    await navigator.serviceWorker.register("/service-worker.js");
                    console.log("Service Worker registrado");
                } catch (e) {
                    console.error("Falha ao registrar o Service Worker:", e);
                }
            });
        }
    </script>
</body>

</html>
